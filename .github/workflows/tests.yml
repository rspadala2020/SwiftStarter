name: Unit Tests

on:
  push:
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select first available iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available iPhone -j | python3 -c "import sys,json; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r in sorted(d, reverse=True) if 'iOS' in r for x in d[r]))")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project SwiftStarter.xcodeproj \
            -scheme SwiftStarter \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            -enableCodeCoverage YES \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcodebuild.log

      # Reads the .xcresult bundle, so it covers both XCTest and Swift Testing.
      - name: Test report
        if: always()
        run: |
          xcrun xcresulttool get test-results summary --path TestResults.xcresult > summary.json || exit 0
          xcrun xcresulttool get test-results tests --path TestResults.xcresult > tests.json || true
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          s = json.load(open("summary.json"))
          print("## Unit Test Report")
          print(f"**Result:** {s.get('result')}  ")
          print(f"Total: {s.get('totalTestCount')} | Passed: {s.get('passedTests')} | Failed: {s.get('failedTests')} | Skipped: {s.get('skippedTests')}")
          for f in s.get("testFailures", []):
              print(f"- :x: `{f.get('testName')}`: {f.get('failureText')}")
          if os.path.exists("tests.json"):
              rows = []
              def walk(n):
                  if n.get("nodeType") == "Test Case":
                      rows.append((n.get("result"), n.get("name"), n.get("duration", "")))
                  for c in n.get("children", []):
                      walk(c)
              for n in json.load(open("tests.json")).get("testNodes", []):
                  walk(n)
              print("\n| Result | Test | Duration |\n|---|---|---|")
              for r in rows:
                  print(f"| {r[0]} | {r[1]} | {r[2]} |")
          PY

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "## Code coverage"
            echo '```'
            xcrun xccov view --report --only-targets TestResults.xcresult || echo "no coverage data"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults.xcresult
            summary.json
            tests.json
            xcodebuild.log
